name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-crates-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      controller_sha: ${{ steps.identity.outputs.controller_sha }}
      release_sha: ${{ steps.identity.outputs.release_sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Admit exact current public main and immutable tag
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          export LC_ALL=C
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          current_main=$(git rev-parse refs/remotes/origin/main)
          test "$GITHUB_SHA" = "$current_main"
          git fetch --force origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
          test "$(git cat-file -t "refs/tags/v$RELEASE_VERSION")" = tag
          release_sha=$(git rev-list -n 1 "refs/tags/v$RELEASE_VERSION")
          git merge-base --is-ancestor "$release_sha" "$current_main"
          git checkout --detach "$release_sha"
          test "$(git describe --exact-match --tags)" = "v$RELEASE_VERSION"
          {
            echo "controller_sha=$current_main"
            echo "release_sha=$release_sha"
            echo "version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.mod

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.7.2
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Require a closed release changelog and version generation
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: >-
          uv run --project sdk/python --frozen python
          scripts/version_domains.py verify-release
          --version "$RELEASE_VERSION"

      - name: Verify exact release repository
        run: ./scripts/verify.sh

      - name: Run exact release soak
        run: >-
          python3 scripts/test_harness.py run
          rust-soak
          --report .cache/test-harness/release-rust-soak.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crates-release-verification-${{ inputs.version }}
          path: .cache/test-harness/release-rust-soak.json
          if-no-files-found: error

  stage:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Stage exact crate archives without publication identity
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: >-
          python3 scripts/crates_release.py stage
          --version "$RELEASE_VERSION"
          --release-sha "$RELEASE_SHA"
          --output "$RUNNER_TEMP/crates-stage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates-release-stage-${{ inputs.version }}
          path: ${{ runner.temp }}/crates-stage
          if-no-files-found: error
          retention-days: 1

  close:
    needs: [verify, stage]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crates-release-stage-${{ inputs.version }}
          path: ${{ runner.temp }}/crates-candidate

      - name: Install Rust without publication identity
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Independently close exact crate bytes
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 scripts/crates_release.py stage \
            --version "$RELEASE_VERSION" \
            --release-sha "$RELEASE_SHA" \
            --output "$RUNNER_TEMP/crates-reference"
          python3 scripts/crates_release.py compare-stages \
            --candidate "$RUNNER_TEMP/crates-candidate" \
            --reference "$RUNNER_TEMP/crates-reference"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crates-release-closed-${{ inputs.version }}
          path: ${{ runner.temp }}/crates-candidate
          if-no-files-found: error
          retention-days: 1

  executor-witness:
    needs: verify
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind the credential-free macOS executor witness
        id: identity
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Rust without publication identity
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Verify the exact release executor on macOS
        run: >-
          python3 scripts/test_harness.py run
          rust-executor-plugin
          --report .cache/test-harness/release-executor-macos.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crates-release-executor-macos-${{ inputs.version }}
          path: .cache/test-harness/release-executor-macos.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, close, executor-witness]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.controller_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          path: release-payload
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crates-release-closed-${{ inputs.version }}
          path: ${{ runner.temp }}/crates-stage

      - name: Rebind publisher to the verified commit
        env:
          CONTROLLER_SHA: ${{ needs.verify.outputs.controller_sha }}
          CYMULE_RELEASE_WORKSPACE: ${{ github.workspace }}/release-payload
          EXECUTOR_WITNESS_SHA: ${{ needs.executor-witness.outputs.release_sha }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          test "$EXECUTOR_WITNESS_SHA" = "$RELEASE_SHA"
          git diff --quiet "$CONTROLLER_SHA" -- scripts/crates_release.py scripts/version_domains.py
          remote_release_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          test -n "$remote_release_sha"
          test "$remote_release_sha" = "$RELEASE_SHA"
          test "$(git -C "$CYMULE_RELEASE_WORKSPACE" rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git -C "$CYMULE_RELEASE_WORKSPACE" describe --exact-match --tags)" = "v$RELEASE_VERSION"
          python3 scripts/crates_release.py list >/dev/null

      - name: Acquire short-lived crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish or retain exact staged crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          CONTROLLER_SHA: ${{ needs.verify.outputs.controller_sha }}
          CYMULE_RELEASE_WORKSPACE: ${{ github.workspace }}/release-payload
          CYMULE_CRATES_STAGE: ${{ runner.temp }}/crates-stage
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_TAG: v${{ needs.verify.outputs.version }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CONTROLLER_SHA"
          git diff --quiet "$CONTROLLER_SHA" -- scripts/crates_release.py scripts/version_domains.py
          remote_release_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | cut -f1)
          test -n "$remote_release_sha"
          test "$remote_release_sha" = "$RELEASE_SHA"
          python3 scripts/crates_release.py publish --version "$RELEASE_VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: crates-release-${{ inputs.version }}
          path: release-payload/.cache/crates-release/${{ inputs.version }}/publish.json
          if-no-files-found: warn

  verify-published:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust without publication identity
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Verify exact crates.io catalog and fresh consumers
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: python3 scripts/crates_release.py verify-registry --version "$RELEASE_VERSION"
