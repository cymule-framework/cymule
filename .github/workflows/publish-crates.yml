name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version without the v prefix
        required: true
        type: string
      authentication:
        description: Use bootstrap only for the first publication of new crate names
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - bootstrap

permissions: {}

concurrency:
  group: publish-crates-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Verify immutable release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --exact-match --tags)" = "v$RELEASE_VERSION"
          test "$(git cat-file -t "refs/tags/v$RELEASE_VERSION")" = tag

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.mod

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.7.2
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Verify complete repository and package bytes
        run: ./scripts/verify.sh

      - name: Acquire short-lived crates.io token
        if: inputs.authentication == 'trusted'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify bootstrap credential
        if: inputs.authentication == 'bootstrap'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish or retain exact crates with trusted publishing
        if: inputs.authentication == 'trusted'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/crates_release.py publish --version "$RELEASE_VERSION"

      - name: Bootstrap first crate versions through Actions
        if: inputs.authentication == 'bootstrap'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/crates_release.py publish --version "$RELEASE_VERSION"

      - name: Verify fresh crates.io consumers
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/crates_release.py verify-registry --version "$RELEASE_VERSION"

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: crates-release-${{ inputs.version }}
          path: |
            .cache/crates-package/${{ inputs.version }}/report.json
            .cache/crates-release/${{ inputs.version }}/publish.json
          if-no-files-found: warn
