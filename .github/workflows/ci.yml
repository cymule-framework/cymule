name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select verification lanes
    runs-on: ubuntu-24.04
    outputs:
      meta: ${{ steps.plan.outputs.meta }}
      package_typescript: ${{ steps.plan.outputs.package_typescript }}
      protocol: ${{ steps.plan.outputs.protocol }}
      rust_static: ${{ steps.plan.outputs.rust_static }}
      rust_semantic: ${{ steps.plan.outputs.rust_semantic }}
      rust_durable: ${{ steps.plan.outputs.rust_durable }}
      rust_plugins: ${{ steps.plan.outputs.rust_plugins }}
      rust_package: ${{ steps.plan.outputs.rust_package }}
      sdk_go: ${{ steps.plan.outputs.sdk_go }}
      sdk_python: ${{ steps.plan.outputs.sdk_python }}
      sdk_rust: ${{ steps.plan.outputs.sdk_rust }}
      sdk_typescript: ${{ steps.plan.outputs.sdk_typescript }}
      version_domain: ${{ steps.plan.outputs.version_domain }}
      workbench: ${{ steps.plan.outputs.workbench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact change and select suites
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=HEAD
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PULL_REQUEST_BASE
          elif [ "$EVENT_NAME" = push ] && [ -n "$EVENT_BEFORE" ] && ! printf '%s' "$EVENT_BEFORE" | grep -Eq '^0+$'; then
            base=$EVENT_BEFORE
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "event base $base is not reachable from the published history; selecting full verification"
            base=HEAD
          fi
          matrix=$(python3 scripts/test_harness.py plan \
            --base "$base" \
            --head HEAD \
            --no-worktree \
            --full-if-empty \
            --report .cache/test-harness/plan.json \
            --format github-matrix)
          MATRIX=$matrix python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          lanes = {
              entry["lane"]: entry["suite_args"]
              for entry in json.loads(os.environ["MATRIX"])["include"]
          }
          for lane in (
              "meta", "package-typescript", "protocol", "rust-static",
              "rust-semantic", "rust-durable", "rust-plugins", "rust-package", "sdk-go",
              "sdk-python", "sdk-rust", "sdk-typescript", "version-domain", "workbench",
          ):
              print(f"{lane.replace('-', '_')}={lanes.get(lane, '')}")
          PY
          python3 scripts/test_harness.py plan \
            --base "$base" \
            --head HEAD \
            --no-worktree \
            --full-if-empty
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-plan
          path: .cache/test-harness/plan.json
          if-no-files-found: warn

  meta:
    name: Verify / meta
    needs: plan
    if: needs.plan.outputs.meta != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: contains(needs.plan.outputs.meta, 'harness') || contains(needs.plan.outputs.meta, 'release-workflows')
        with:
          version: 0.7.2
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.meta }}
          --keep-going
          --report .cache/test-harness/meta.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-meta
          path: .cache/test-harness/meta.json
          if-no-files-found: warn

  version-domain:
    name: Verify / version-domain source closure
    needs: plan
    if: needs.plan.outputs.version_domain != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.7.2
      - name: Close the exact public source generation
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.version_domain }}
          --report .cache/test-harness/version-domain.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-version-domain
          path: .cache/test-harness/version-domain.json
          if-no-files-found: warn

  rust-static:
    name: Verify / rust-static
    needs: plan
    if: needs.plan.outputs.rust_static != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.rust_static }}
          --keep-going
          --report .cache/test-harness/rust-static.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-static
          path: .cache/test-harness/rust-static.json
          if-no-files-found: warn

  rust-semantic:
    name: Verify / rust-semantic
    needs: plan
    if: needs.plan.outputs.rust_semantic != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.rust_semantic }}
          --keep-going
          --report .cache/test-harness/rust-semantic.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-semantic
          path: .cache/test-harness/rust-semantic.json
          if-no-files-found: warn

  rust-durable:
    name: Verify / rust-durable
    needs: plan
    if: needs.plan.outputs.rust_durable != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.rust_durable }}
          --keep-going
          --report .cache/test-harness/rust-durable.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-durable
          path: .cache/test-harness/rust-durable.json
          if-no-files-found: warn

  rust-plugins:
    name: Verify / rust-plugins
    needs: plan
    if: needs.plan.outputs.rust_plugins != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.rust_plugins }}
          --keep-going
          --report .cache/test-harness/rust-plugins.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-plugins
          path: .cache/test-harness/rust-plugins.json
          if-no-files-found: warn

  executor-macos:
    name: Verify / executor-macos
    needs: plan
    if: contains(needs.plan.outputs.rust_plugins, 'rust-executor-plugin')
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the macOS executor witness to the exact candidate
        id: identity
        run: |
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run the exact macOS executor witness
        run: >-
          python3 scripts/test_harness.py run
          rust-executor-plugin
          --report .cache/test-harness/executor-macos.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-executor-macos
          path: .cache/test-harness/executor-macos.json
          if-no-files-found: error

  rust-package:
    name: Verify / rust-package
    needs: plan
    if: needs.plan.outputs.rust_package != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.rust_package }}
          --keep-going
          --report .cache/test-harness/rust-package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-package
          path: .cache/test-harness/rust-package.json
          if-no-files-found: warn

  protocol:
    name: Verify / protocol
    needs: plan
    if: needs.plan.outputs.protocol != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.7.2
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.protocol }}
          --keep-going
          --report .cache/test-harness/protocol.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-protocol
          path: .cache/test-harness/protocol.json
          if-no-files-found: warn

  sdk-rust:
    name: Verify / sdk-rust
    needs: plan
    if: needs.plan.outputs.sdk_rust != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.sdk_rust }}
          --keep-going
          --report .cache/test-harness/sdk-rust.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-sdk-rust
          path: .cache/test-harness/sdk-rust.json
          if-no-files-found: warn

  sdk-typescript:
    name: Verify / sdk-typescript
    needs: plan
    if: needs.plan.outputs.sdk_typescript != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.sdk_typescript }}
          --keep-going
          --report .cache/test-harness/sdk-typescript.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-sdk-typescript
          path: .cache/test-harness/sdk-typescript.json
          if-no-files-found: warn

  sdk-python:
    name: Verify / sdk-python
    needs: plan
    if: needs.plan.outputs.sdk_python != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.7.2
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.sdk_python }}
          --keep-going
          --report .cache/test-harness/sdk-python.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-sdk-python
          path: .cache/test-harness/sdk-python.json
          if-no-files-found: warn

  sdk-go:
    name: Verify / sdk-go
    needs: plan
    if: needs.plan.outputs.sdk_go != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.mod
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.sdk_go }}
          --keep-going
          --report .cache/test-harness/sdk-go.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-sdk-go
          path: .cache/test-harness/sdk-go.json
          if-no-files-found: warn

  package-typescript:
    name: Verify / package-typescript
    needs: plan
    if: needs.plan.outputs.package_typescript != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.package_typescript }}
          --keep-going
          --report .cache/test-harness/package-typescript.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-package-typescript
          path: .cache/test-harness/package-typescript.json
          if-no-files-found: warn

  workbench:
    name: Verify / workbench
    needs: plan
    if: needs.plan.outputs.workbench != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run selected verification suites
        run: >-
          python3 scripts/test_harness.py run
          ${{ needs.plan.outputs.workbench }}
          --keep-going
          --report .cache/test-harness/workbench.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-workbench
          path: .cache/test-harness/workbench.json
          if-no-files-found: warn

  required:
    name: Required CI
    if: always()
    needs:
      - plan
      - meta
      - rust-static
      - rust-semantic
      - rust-durable
      - rust-plugins
      - executor-macos
      - rust-package
      - protocol
      - sdk-rust
      - sdk-typescript
      - sdk-python
      - sdk-go
      - package-typescript
      - version-domain
      - workbench
    runs-on: ubuntu-24.04
    steps:
      - name: Close every selected verification lane
        env:
          GITHUB_SOURCE_SHA: ${{ github.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["plan"]["result"] != "success":
              raise SystemExit("verification planner did not succeed")
          lanes = {
              "meta": "meta",
              "rust-static": "rust_static",
              "rust-semantic": "rust_semantic",
              "rust-durable": "rust_durable",
              "rust-plugins": "rust_plugins",
              "rust-package": "rust_package",
              "protocol": "protocol",
              "sdk-rust": "sdk_rust",
              "sdk-typescript": "sdk_typescript",
              "sdk-python": "sdk_python",
              "sdk-go": "sdk_go",
              "package-typescript": "package_typescript",
              "version-domain": "version_domain",
              "workbench": "workbench",
          }
          outputs = needs["plan"]["outputs"]
          for job, output in lanes.items():
              selected = bool(outputs.get(output, ""))
              expected = "success" if selected else "skipped"
              observed = needs[job]["result"]
              if observed != expected:
                  raise SystemExit(
                      f"{job} result {observed!r}, expected {expected!r} "
                      f"for selected={selected}"
                  )
          executor_selected = "rust-executor-plugin" in outputs.get(
              "rust_plugins", ""
          ).split()
          executor_result = needs["executor-macos"]["result"]
          expected_executor_result = "success" if executor_selected else "skipped"
          if executor_result != expected_executor_result:
              raise SystemExit(
                  f"executor-macos result {executor_result!r}, expected "
                  f"{expected_executor_result!r} for selected={executor_selected}"
              )
          if executor_selected and needs["executor-macos"]["outputs"].get(
              "source_sha"
          ) != os.environ["GITHUB_SOURCE_SHA"]:
              raise SystemExit("executor-macos witness belongs to another source SHA")
          print("closed every selected verification lane")
          PY
