name: Compatibility

on:
  schedule:
    - cron: "17 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  durable-platform:
    name: Compatibility / durable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Run portable durable witnesses
        shell: bash
        run: >-
          python3 scripts/test_harness.py run
          rust-portability
          --report .cache/test-harness/rust-portability.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-portability-${{ matrix.os }}
          path: .cache/test-harness/rust-portability.json
          if-no-files-found: warn
