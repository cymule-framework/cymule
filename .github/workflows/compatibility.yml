name: Compatibility

on:
  schedule:
    - cron: "17 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  durable-platform:
    name: Compatibility / durable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: 3.14.0
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
      - name: Run portable durable witnesses
        shell: bash
        run: >-
          python3 scripts/test_harness.py run
          rust-portability
          --report .cache/test-harness/rust-portability.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-harness-rust-portability-${{ matrix.os }}
          path: .cache/test-harness/rust-portability.json
          if-no-files-found: warn
