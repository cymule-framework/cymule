name: Analysis

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Analysis / semantic coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component llvm-tools-preview
          rustup default 1.97.0
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Run coverage witness
        run: >-
          python3 scripts/test_harness.py run
          rust-coverage
          --report .cache/test-harness/rust-coverage.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: analysis-coverage
          path: |
            .cache/test-analysis/coverage.json
            .cache/test-harness/rust-coverage.json
          if-no-files-found: warn

  mutation:
    name: Analysis / semantic mutation / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: 1-of-8, shard: 1/8 }
          - { id: 2-of-8, shard: 2/8 }
          - { id: 3-of-8, shard: 3/8 }
          - { id: 4-of-8, shard: 4/8 }
          - { id: 5-of-8, shard: 5/8 }
          - { id: 6-of-8, shard: 6/8 }
          - { id: 7-of-8, shard: 7/8 }
          - { id: 8-of-8, shard: 8/8 }
    runs-on: ubuntu-24.04
    env:
      CYMULE_MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust mutation tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run mutation witness
        run: >-
          python3 scripts/test_harness.py run
          rust-mutation
          --report .cache/test-harness/rust-mutation.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: analysis-mutation-${{ matrix.id }}
          path: |
            .cache/test-analysis/mutation
            .cache/test-harness/rust-mutation.json
          if-no-files-found: warn
