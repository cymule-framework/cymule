name: Analysis

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Analysis / semantic coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Run coverage witness
        run: >-
          python3 scripts/test_harness.py run
          rust-coverage
          --report .cache/test-harness/rust-coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: analysis-coverage
          path: |
            .cache/test-analysis/coverage.json
            .cache/test-harness/rust-coverage.json
          if-no-files-found: warn

  coverage-plugins:
    name: Analysis / plugin coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust coverage tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
          rustup default 1.97.1
          cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Run plugin coverage witness
        run: >-
          python3 scripts/test_harness.py run
          rust-coverage-plugins
          --report .cache/test-harness/rust-coverage-plugins.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: analysis-coverage-plugins
          path: |
            .cache/test-analysis/coverage-plugins.json
            .cache/test-harness/rust-coverage-plugins.json
          if-no-files-found: warn

  mutation:
    name: Analysis / semantic mutation / ${{ matrix.target }} / ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: core, id: 1-of-8, shard: 0/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 2-of-8, shard: 1/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 3-of-8, shard: 2/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 4-of-8, shard: 3/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 5-of-8, shard: 4/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 6-of-8, shard: 5/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 7-of-8, shard: 6/8, suite: rust-mutation, output: mutation }
          - { target: core, id: 8-of-8, shard: 7/8, suite: rust-mutation, output: mutation }
          - { target: evolution-m4, id: 1-of-4, shard: 0/4, suite: rust-mutation-evolution-m4, output: mutation-evolution-m4 }
          - { target: evolution-m4, id: 2-of-4, shard: 1/4, suite: rust-mutation-evolution-m4, output: mutation-evolution-m4 }
          - { target: evolution-m4, id: 3-of-4, shard: 2/4, suite: rust-mutation-evolution-m4, output: mutation-evolution-m4 }
          - { target: evolution-m4, id: 4-of-4, shard: 3/4, suite: rust-mutation-evolution-m4, output: mutation-evolution-m4 }
          - { target: dayone-plugins, id: 1-of-4, shard: 0/4, suite: rust-mutation-plugins, output: mutation-plugins }
          - { target: dayone-plugins, id: 2-of-4, shard: 1/4, suite: rust-mutation-plugins, output: mutation-plugins }
          - { target: dayone-plugins, id: 3-of-4, shard: 2/4, suite: rust-mutation-plugins, output: mutation-plugins }
          - { target: dayone-plugins, id: 4-of-4, shard: 3/4, suite: rust-mutation-plugins, output: mutation-plugins }
    runs-on: ubuntu-24.04
    env:
      CYMULE_MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust mutation tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run mutation witness
        run: >-
          python3 scripts/test_harness.py run
          ${{ matrix.suite }}
          --report .cache/test-harness/${{ matrix.suite }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: analysis-mutation-${{ matrix.target }}-${{ matrix.id }}
          path: |
            .cache/test-analysis/${{ matrix.output }}
            .cache/test-harness/${{ matrix.suite }}.json
          if-no-files-found: warn
