name: Soak

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: Generated causal replay cases
        required: false
        default: "16384"
        type: string
      repetitions:
        description: Deterministic fault-sweep repetitions
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-soak:
    name: Soak / Rust semantic and fault properties
    runs-on: ubuntu-24.04
    env:
      PROPTEST_CASES: ${{ inputs.proptest_cases || '16384' }}
      CYMULE_SOAK_REPETITIONS: ${{ inputs.repetitions || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Run the independent soak suite
        run: >-
          python3 scripts/test_harness.py run
          rust-soak
          --report .cache/test-harness/rust-soak.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-harness-rust-soak
          path: .cache/test-harness/rust-soak.json
          if-no-files-found: warn
