name: Sync public mirror

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: public-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Install deterministic history rewriter
        run: python3 -m pip install git-filter-repo==2.47.0

      - name: Read complete private source history
        env:
          SOURCE_URL: ${{ secrets.CYMULE_SOURCE_URL }}
          SOURCE_USERNAME: ${{ secrets.CYMULE_SOURCE_USERNAME }}
          SOURCE_TOKEN: ${{ secrets.CYMULE_SOURCE_TOKEN }}
        run: |
          authenticated_url="https://${SOURCE_USERNAME}:${SOURCE_TOKEN}@${SOURCE_URL#https://}"
          git clone --quiet "$authenticated_url" "$RUNNER_TEMP/source"

      - name: Rewrite only private repository metadata
        env:
          SOURCE_URL: ${{ secrets.CYMULE_SOURCE_URL }}
        run: |
          cd "$RUNNER_TEMP/source"
          git log --reverse --format='%an%x00%ae%x00%aI%x00%cn%x00%ce%x00%cI%x00%B%x00' > "$RUNNER_TEMP/metadata.before"
          source_without_suffix=${SOURCE_URL%.git}
          source_location=${source_without_suffix#https://}
          source_host=${source_location%%/*}
          source_path=${source_location#*/}
          {
            printf 'literal:%s==>https://github.com/cymule-framework/cymule.git\n' "$SOURCE_URL"
            printf 'literal:%s==>https://github.com/cymule-framework/cymule\n' "$source_without_suffix"
            printf 'literal:%s==>github.com/cymule-framework/cymule\n' "$source_location"
            printf 'literal:%s==>github.com\n' "$source_host"
            printf 'literal:%s==>cymule-framework/cymule\n' "$source_path"
          } > "$RUNNER_TEMP/replacements.txt"
          git filter-repo --force \
            --path .gitlab-ci.yml \
            --path .gitlab/ \
            --invert-paths \
            --replace-text "$RUNNER_TEMP/replacements.txt" \
            --preserve-commit-hashes \
            --prune-empty never \
            --prune-degenerate never
          git log --reverse --format='%an%x00%ae%x00%aI%x00%cn%x00%ce%x00%cI%x00%B%x00' > "$RUNNER_TEMP/metadata.after"
          cmp "$RUNNER_TEMP/metadata.before" "$RUNNER_TEMP/metadata.after"
          mapfile -t revisions < <(git rev-list --all)
          if git grep -n -I -F -e "$source_host" -e "$source_path" "${revisions[@]}"; then
            echo "rewritten history contains a private repository reference" >&2
            exit 2
          fi

      - name: Compare rewritten and public tips
        id: compare
        env:
          GH_TOKEN: ${{ secrets.CYMULE_PUBLIC_PUSH_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/source"
          source_tip=$(git rev-parse main)
          public_tip=$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/cymule-framework/cymule.git" \
            refs/heads/main | awk '{print $1}')
          if [ "$source_tip" = "$public_tip" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "public mirror already matches rewritten source $source_tip"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "rewritten source $source_tip will replace public tip ${public_tip:-<missing>}"
          fi

      - name: Force-publish changed rewritten history
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CYMULE_PUBLIC_PUSH_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/source"
          git remote add public "https://x-access-token:${GH_TOKEN}@github.com/cymule-framework/cymule.git"
          git push --force public main:main
