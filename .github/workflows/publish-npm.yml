name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.identity.outputs.release_sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      tag_exists: ${{ steps.identity.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Admit exact current public main
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main
          current_main=$(git rev-parse refs/remotes/origin/main)
          test "$GITHUB_SHA" = "$current_main"
          package_version=$(node -p "require('./sdk/typescript/package.json').version")
          test "$RELEASE_VERSION" = "$package_version"
          tag="v$RELEASE_VERSION"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-list -n 1 "$tag")" = "$current_main"
            tag_exists=true
          else
            tag_exists=false
          fi
          echo "release_sha=$current_main" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: sdk/go/go.mod

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.7.2
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Verify exact release repository
        run: ./scripts/verify.sh

      - name: Run exact release soak
        run: >-
          python3 scripts/test_harness.py run
          rust-soak
          --report .cache/test-harness/release-rust-soak.json

      - name: Create missing immutable release tag
        if: steps.identity.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.identity.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Cymule $RELEASE_VERSION"
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraHeader=Authorization: Basic $authorization" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$RELEASE_TAG"
          observed=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')
          test "$observed" = "$RELEASE_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: npm-release-verification-${{ inputs.version }}
          path: .cache/test-harness/release-rust-soak.json
          if-no-files-found: error

  stage:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: cymule
            artifact_name: cymule
          - package_name: "@cymule/sdk"
            artifact_name: cymule-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Build and test exact package source
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir sdk/typescript run build
          pnpm --dir sdk/typescript test

      - name: Stage immutable npm archive without publication identity
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          PACKAGE_NAME: ${{ matrix.package_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/package"
          stage_dir="$RUNNER_TEMP/npm-stage-$ARTIFACT_NAME"
          node sdk/typescript/scripts/prepare-package.mjs "$PACKAGE_NAME" "$package_dir"
          python3 scripts/npm_release.py stage \
            --package-dir "$package_dir" \
            --package-name "$PACKAGE_NAME" \
            --version "$RELEASE_VERSION" \
            --release-sha "$RELEASE_SHA" \
            --output "$stage_dir"
          cp scripts/npm_release.py "$stage_dir/npm_release.py"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-stage-${{ matrix.artifact_name }}-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-stage-${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, stage]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: cymule
            artifact_name: cymule
          - package_name: "@cymule/sdk"
            artifact_name: cymule-sdk
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-stage-${{ matrix.artifact_name }}-${{ inputs.version }}
          path: ${{ runner.temp }}/npm-stage

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Authenticate exact staged bytes
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: >-
          python3 "$RUNNER_TEMP/npm-stage/npm_release.py" verify-staged
          --manifest "$RUNNER_TEMP/npm-stage/manifest.json"
          --release-sha "$RELEASE_SHA"

      - name: Publish missing version with trusted provenance
        env:
          PACKAGE_NAME: ${{ matrix.package_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          archive=$(find "$RUNNER_TEMP/npm-stage" -maxdepth 1 -type f -name '*.tgz' -print)
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l | tr -d ' ')" = 1
          status=$(python3 "$RUNNER_TEMP/npm-stage/npm_release.py" registry-status \
            --manifest "$RUNNER_TEMP/npm-stage/manifest.json" \
            --release-sha "$RELEASE_SHA")
          case "$status" in
            exists)
              echo "$PACKAGE_NAME@$RELEASE_VERSION already exists; exact readback follows"
              ;;
            missing)
              npm publish "$archive" --access public --provenance
              ;;
            *)
              echo "unknown npm registry status $status" >&2
              exit 2
              ;;
          esac

      - name: Read back exact tarball digest and provenance
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: >-
          python3 "$RUNNER_TEMP/npm-stage/npm_release.py" verify-registry
          --manifest "$RUNNER_TEMP/npm-stage/manifest.json"
          --release-sha "$RELEASE_SHA"
