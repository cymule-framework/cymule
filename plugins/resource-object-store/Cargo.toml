[package]
name = "cymule-resource-object-store"
description = "Apache object_store Resource adapter for Cymule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
publish.workspace = true

[features]
default = []
azure = ["dep:async-trait", "object_store/azure"]
gcp = ["dep:async-trait", "object_store/gcp"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
cymule-core.workspace = true
cymule-resource.workspace = true
futures-util.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
async-trait = "0.1.92"
cymule-durable-protocol.workspace = true
cymule-test-world = { path = "../../tests/test-world" }
cymule-virtual.workspace = true
fs4 = "1.1.0"
object_store = { workspace = true, features = ["fs"] }

[lints]
workspace = true
