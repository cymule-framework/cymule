[workspace]
resolver = "3"
members = [
  "crates/cymule-authenticated-collections",
  "crates/cymule-core",
  "crates/cymule-durable-protocol",
  "crates/cymule-profile-protocol",
  "crates/cymule-durable",
  "crates/cymule-evolution",
  "crates/cymule-runtime",
  "crates/cymule-resource",
  "crates/cymule-sdk",
  "crates/cymule-virtual",
  "crates/cymule-cli",
  "examples/durable-evaluation-campaign",
  "examples/hello-world",
  "plugins/directory-store",
  "plugins/store-sqlite",
  "plugins/resource-fs",
  "plugins/resource-object-store",
  "plugins/activation-http",
  "plugins/activation-timer",
  "plugins/clock-system",
  "plugins/executor-process",
  "plugins/observability-otel",
  "plugins/agent-mcp",
  "plugins/agent-interaction",
  "plugins/test-adapter",
  "tests/test-world",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cymule-framework/cymule"
homepage = "https://github.com/cymule-framework/cymule"
keywords = ["agent", "durable", "orchestration", "runtime", "workflow"]
publish = ["crates-io"]

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
cymule = { version = "0.2.0", path = "crates/cymule-sdk" }
cymule-authenticated-collections = { version = "0.2.0", path = "crates/cymule-authenticated-collections" }
cymule-agent = { version = "0.2.0", path = "plugins/agent-interaction" }
cymule-clock-system = { version = "0.2.0", path = "plugins/clock-system" }
cymule-core = { version = "0.2.0", path = "crates/cymule-core" }
cymule-durable-protocol = { version = "0.2.0", path = "crates/cymule-durable-protocol" }
cymule-profile-protocol = { version = "0.2.0", path = "crates/cymule-profile-protocol" }
cymule-directory-store = { version = "0.2.0", path = "plugins/directory-store" }
cymule-durable = { version = "0.2.0", path = "crates/cymule-durable" }
cymule-evolution = { version = "0.2.0", path = "crates/cymule-evolution" }
cymule-executor-process = { version = "0.2.0", path = "plugins/executor-process" }
cymule-resource = { version = "0.2.0", path = "crates/cymule-resource" }
cymule-runtime = { version = "0.2.0", path = "crates/cymule-runtime" }
cymule-store-sqlite = { version = "0.2.0", path = "plugins/store-sqlite" }
cymule-test-world = { path = "tests/test-world" }
cymule-virtual = { version = "0.2.0", path = "crates/cymule-virtual" }
axum = "0.8.9"
futures-util = "0.3.34"
jsonschema = { version = "0.49.9", default-features = false }
nix = { version = "=0.31.3", features = ["dir", "fs", "poll", "process", "signal"] }
object_store = { version = "=0.14.1", default-features = false }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = "0.32.1"
rand = "0.9.5"
rmcp = { version = "3.1.3", default-features = false, features = ["client"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
signal-hook = "0.3.18"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3.23", features = ["registry"] }
url = "2.5.8"
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
