[workspace]
resolver = "3"
members = [
  "crates/cymule-core",
  "crates/cymule-agent",
  "crates/cymule-durable",
  "crates/cymule-evolution",
  "crates/cymule-runtime",
  "crates/cymule-resource",
  "crates/cymule-sdk",
  "crates/cymule-virtual",
  "crates/cymule-cli",
  "examples/hello-world",
  "plugins/directory-store",
  "plugins/test-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cymule-framework/cymule"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11.0"
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
