schema_version = 2

[execution_classes.deterministic]
description = "Replayable in-process, compiler, packaging, or static evidence with no external service authority."
suites = [
  "docs",
  "harness",
  "test-world-deterministic",
  "rust-core",
  "rust-workspace",
  "rust-durable",
  "rust-virtual",
  "rust-resource",
  "package-typescript",
  "package-rust",
  "mlir",
  "rust-coverage",
  "rust-coverage-plugins",
  "rust-mutation",
  "rust-mutation-evolution-m4",
  "rust-mutation-plugins",
  "rust-agent-mcp-plugin",
  "release-workflows",
]

[execution_classes.live_process]
description = "Credential-free evidence that executes a built child or crosses a real process-death boundary."
suites = [
  "test-world-live-process",
  "rust-evolution",
  "rust-agent-plugin",
  "protocol",
  "sdk-rust",
  "sdk-typescript",
  "sdk-python",
  "sdk-go",
  "example",
  "rust-soak",
  "rust-store-plugins",
  "rust-resource-plugins",
  "rust-executor-plugin",
  "rust-activation-http",
  "rust-activation-timer",
  "rust-clock-system",
]

[execution_classes.live_provider]
description = "Evidence against a real adapter or provider boundary, kept independent from deterministic semantics."
suites = [
  "rust-directory-plugin",
  "rust-portability",
  "rust-observability-plugin",
]

[suites.docs]
description = "Validate repository-local documentation references."
lane = "meta"
tools = []
commands = [["python3", "scripts/validate_docs.py"]]

[suites.harness]
description = "Validate change routing and harness behavior."
lane = "meta"
tools = []
commands = [["python3", "-m", "unittest", "discover", "-s", "tests/harness", "-p", "test_*.py"]]

[suites.test-world-deterministic]
description = "Validate owned clocks, seeded traces, fault schedules, observations, and temporary domains."
lane = "rust-durable"
tools = ["rust"]
commands = [["cargo", "test", "--package", "cymule-test-world", "--test", "deterministic"]]

[suites.test-world-live-process]
description = "Prove managed child teardown reaches a barrier and reaps a forgotten child."
lane = "rust-durable"
tools = ["rust"]
commands = [["cargo", "test", "--package", "cymule-test-world", "--test", "live_process"]]

[suites.rust-workspace]
description = "Run formatting, static analysis, and documentation for the Rust workspace."
lane = "rust-static"
tools = ["rust"]
commands = [["./scripts/verify-rust-static.sh"]]

[suites.rust-core]
description = "Run the small Rust semantic kernel and its property tests."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-core"]]

[suites.rust-durable]
description = "Run M1 persistence, recovery, and deterministic fault tests."
lane = "rust-durable"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-durable"]]

[suites.rust-virtual]
description = "Run M3 bounded scheduling, migration, compaction, and fault tests."
lane = "rust-durable"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-virtual"]]

[suites.rust-evolution]
description = "Run M4 evolution semantics and fault tests."
lane = "rust-durable"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-evolution"]]

[suites.rust-resource]
description = "Run provider-neutral Resource semantics."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-resource"]]

[suites.rust-agent-plugin]
description = "Run the optional Agent interaction plugin fault suite."
lane = "rust-plugins"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-agent"]]

[suites.rust-directory-plugin]
description = "Run the atomic directory-store adapter suite."
lane = "rust-plugins"
tools = ["rust"]
commands = [["./scripts/verify-rust.sh", "cymule-directory-store"]]

[suites.protocol]
description = "Build the engine and validate frozen schemas and semantic rejection."
lane = "protocol"
tools = ["rust", "uv"]
commands = [["./scripts/verify-protocol.sh"]]

[suites.sdk-rust]
description = "Run the Rust SDK against the freshly built Rust engine."
lane = "sdk-rust"
tools = ["rust"]
commands = [["./scripts/verify-sdk.sh", "rust"]]

[suites.sdk-typescript]
description = "Run the TypeScript SDK against the freshly built Rust engine."
lane = "sdk-typescript"
tools = ["rust", "node"]
commands = [["./scripts/verify-sdk.sh", "typescript"]]

[suites.sdk-python]
description = "Run Python SDK E2E and install its wheel in a clean environment."
lane = "sdk-python"
tools = ["rust", "uv"]
commands = [
  ["./scripts/verify-sdk.sh", "python"],
  ["./scripts/verify-python-package.sh"],
]

[suites.sdk-go]
description = "Run Go SDK E2E and compile a clean external consumer."
lane = "sdk-go"
tools = ["rust", "go"]
commands = [
  ["./scripts/verify-sdk.sh", "go"],
  ["./scripts/verify-go-package.sh"],
]

[suites.example]
description = "Run Hello World plus durable campaign crash, integrity, lease, and evolution paths."
lane = "protocol"
tools = ["rust"]
commands = [["./scripts/verify-example.sh"]]

[suites.package-typescript]
description = "Build and dry-pack both public TypeScript package names."
lane = "package-typescript"
tools = ["node"]
commands = [["./scripts/verify-typescript-package.sh"]]

[suites.package-rust]
description = "Build deterministic public Rust archives and compile their normalized registry manifests."
lane = "rust-package"
tools = ["rust"]
commands = [["./scripts/verify-crates-package.sh"]]

[suites.release-workflows]
description = "Validate immutable Actions pins, least-privilege publication jobs, and public/private mirror separation."
lane = "meta"
tools = []
commands = [["python3", "scripts/verify_release_workflows.py"]]

[suites.mlir]
description = "Run the optional MLIR workbench smoke test when the pinned toolchain exists."
lane = "workbench"
tools = []
allow_skip = true
commands = [["./compiler/mlir/verify.sh"]]

[suites.rust-soak]
description = "Repeat high-risk Rust properties and deterministic fault sweeps at soak depth."
lane = "rust-durable"
tools = ["rust"]
commands = [["./scripts/verify-soak.sh"]]

[suites.rust-coverage]
description = "Measure semantic Rust coverage against the recorded non-regression floor."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-analysis.sh", "coverage"]]

[suites.rust-coverage-plugins]
description = "Measure day-one plugin coverage against its independent non-regression floor."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-analysis.sh", "coverage-plugins"]]

[suites.rust-mutation]
description = "Prove cymule-core tests kill generated semantic mutations."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-analysis.sh", "mutation"]]

[suites.rust-mutation-evolution-m4]
description = "Prove M4 compatibility, safe-point, relink, and restart tests kill semantic mutations."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-analysis.sh", "mutation-evolution-m4"]]

[suites.rust-mutation-plugins]
description = "Prove day-one plugin tests kill critical admission and ambiguity mutations."
lane = "rust-semantic"
tools = ["rust"]
commands = [["./scripts/verify-analysis.sh", "mutation-plugins"]]

[suites.rust-portability]
description = "Run portable core, durable, and directory-store witnesses."
lane = "rust-durable"
tools = ["rust"]
commands = [
  ["bash", "./scripts/verify-rust.sh", "cymule-core"],
  ["bash", "./scripts/verify-rust.sh", "cymule-durable"],
  ["bash", "./scripts/verify-rust.sh", "cymule-directory-store"],
]

[suites.rust-store-plugins]
description = "Run SQLite and directory durable-store adapters."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-store-sqlite", "cymule-directory-store"]]

[suites.rust-resource-plugins]
description = "Run filesystem and Apache object-store Resource adapters."
lane = "rust-plugins"
tools = ["rust"]
commands = [
  ["bash", "./scripts/verify-rust.sh", "cymule-resource-fs", "cymule-resource-object-store"],
  ["cargo", "check", "--package", "cymule-resource-object-store", "--all-features"],
]

[suites.rust-activation-http]
description = "Run HTTP activation semantics and real ingress/selection/activation/acknowledgement process-death witnesses."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-activation-http"]]

[suites.rust-activation-timer]
description = "Run timer activation semantics and real schedule/selection/activation/acknowledgement process-death witnesses."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-activation-timer"]]

[suites.rust-clock-system]
description = "Run restart-monotonic clock semantics and real process death on both observation sides."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-clock-system"]]

[suites.rust-executor-plugin]
description = "Run the hardened process executor adapter."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-executor-process"]]

[suites.rust-observability-plugin]
description = "Run bounded OpenTelemetry observation and pipeline tests."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-observability-otel"]]

[suites.rust-agent-mcp-plugin]
description = "Run official RMCP tool mapping and boundary tests."
lane = "rust-plugins"
tools = ["rust"]
commands = [["bash", "./scripts/verify-rust.sh", "cymule-agent-mcp"]]

[suites.full]
description = "Run every required Cymule verification family."
abstract = true
requires = [
  "docs",
  "harness",
  "test-world-deterministic",
  "test-world-live-process",
  "rust-workspace",
  "rust-core",
  "rust-durable",
  "rust-virtual",
  "rust-evolution",
  "rust-resource",
  "rust-agent-plugin",
  "protocol",
  "sdk-rust",
  "sdk-typescript",
  "sdk-python",
  "sdk-go",
  "example",
  "package-typescript",
  "package-rust",
  "release-workflows",
  "rust-store-plugins",
  "rust-resource-plugins",
  "rust-activation-http",
  "rust-activation-timer",
  "rust-clock-system",
  "rust-executor-plugin",
  "rust-observability-plugin",
  "rust-agent-mcp-plugin",
  "mlir",
]

[suites.catalog]
description = "Run every normal and scheduled verification leaf after harness catalog or runner changes."
abstract = true
requires = [
  "full",
  "rust-soak",
  "rust-coverage",
  "rust-coverage-plugins",
  "rust-mutation",
  "rust-mutation-evolution-m4",
  "rust-mutation-plugins",
  "rust-portability",
]

# Every workspace package owns one or more behavioral leaves. Source changes
# select the owner plus the complete transitive Cargo reverse-dependency closure
# through this table; compilation alone is not a behavioral witness.
[package_suites]
"cymule-core" = ["rust-core"]
"cymule-runtime" = ["protocol"]
"cymule-durable" = ["rust-durable"]
"cymule-evolution" = ["rust-evolution"]
"cymule-resource" = ["rust-resource"]
"cymule" = ["sdk-rust"]
"cymule-virtual" = ["rust-virtual"]
"cymule-cli" = ["protocol"]
"cymule-example-durable-evaluation-campaign" = ["example"]
"cymule-example-hello-world" = ["example"]
"cymule-directory-store" = ["rust-directory-plugin"]
"cymule-store-sqlite" = ["rust-store-plugins"]
"cymule-resource-fs" = ["rust-resource-plugins"]
"cymule-resource-object-store" = ["rust-resource-plugins"]
"cymule-activation-http" = ["rust-activation-http"]
"cymule-activation-timer" = ["rust-activation-timer"]
"cymule-clock-system" = ["rust-clock-system"]
"cymule-executor-process" = ["rust-executor-plugin"]
"cymule-observability-otel" = ["rust-observability-plugin"]
"cymule-agent-mcp" = ["rust-agent-mcp-plugin"]
"cymule-agent" = ["rust-agent-plugin"]
"cymule-test-adapter" = ["protocol"]
"cymule-test-world" = ["test-world-deterministic", "test-world-live-process"]

# Ordered path ownership. Matching routes form a conservative union; a path
# matching no route escalates the complete change to `full`.

[[routes]]
patterns = ["README.md", "docs/**", "**/AGENTS.md", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "LICENSE*"]
suites = ["docs"]

[[routes]]
patterns = ["Cargo.toml", "Cargo.lock", "**/Cargo.toml", "scripts/crates-release.toml", "scripts/crates_release.py", "scripts/verify-crates-package.sh"]
suites = ["package-rust", "release-workflows"]

[[routes]]
patterns = ["sdk/typescript/package.json", "sdk/python/pyproject.toml"]
suites = ["package-rust", "package-typescript", "release-workflows"]

[[routes]]
patterns = ["scripts/npm_release.py", "scripts/verify_release_workflows.py", "scripts/verify_github_release_settings.py"]
suites = ["package-typescript", "release-workflows"]

[[routes]]
patterns = ["crates/cymule-core/tests/**"]
suites = ["rust-core"]

[[routes]]
patterns = ["crates/cymule-core/src/**", "crates/cymule-core/Cargo.toml", "crates/cymule-runtime/**", "crates/cymule-cli/**"]
suites = ["protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go", "example"]

[[routes]]
patterns = ["crates/cymule-durable/tests/**", "crates/cymule-durable/src/executor.rs", "crates/cymule-durable/src/error.rs", "crates/cymule-durable/src/wait_source.rs"]
suites = ["rust-durable"]

[[routes]]
patterns = ["crates/cymule-durable/src/coordinator.rs", "crates/cymule-durable/src/store.rs"]
suites = ["rust-durable", "rust-directory-plugin", "rust-virtual", "rust-resource", "rust-agent-plugin"]

[[routes]]
patterns = ["crates/cymule-durable/src/model.rs", "crates/cymule-durable/src/lib.rs", "crates/cymule-durable/Cargo.toml"]
suites = ["rust-durable", "rust-directory-plugin", "rust-virtual", "rust-resource", "rust-agent-plugin", "protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["crates/cymule-virtual/**"]
suites = ["rust-virtual", "protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["crates/cymule-evolution/**"]
suites = ["rust-evolution"]

[[routes]]
patterns = ["crates/cymule-resource/**"]
suites = ["rust-resource", "protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["crates/cymule-sdk/**"]
suites = ["sdk-rust", "protocol"]

[[routes]]
patterns = ["plugins/agent-interaction/**"]
suites = ["rust-agent-plugin"]

[[routes]]
patterns = ["plugins/directory-store/**"]
suites = ["rust-directory-plugin", "rust-durable"]

[[routes]]
patterns = ["plugins/store-sqlite/**"]
suites = ["rust-store-plugins", "example"]

[[routes]]
patterns = ["plugins/resource-fs/**", "plugins/resource-object-store/**"]
suites = ["rust-resource-plugins"]

[[routes]]
patterns = ["plugins/activation-http/**"]
suites = ["rust-activation-http"]

[[routes]]
patterns = ["plugins/activation-timer/**"]
suites = ["rust-activation-timer"]

[[routes]]
patterns = ["plugins/clock-system/**"]
suites = ["rust-clock-system"]

[[routes]]
patterns = ["plugins/executor-process/**"]
suites = ["rust-executor-plugin"]

[[routes]]
patterns = ["plugins/observability-otel/**"]
suites = ["rust-observability-plugin"]

[[routes]]
patterns = ["plugins/agent-mcp/**"]
suites = ["rust-agent-mcp-plugin"]

[[routes]]
patterns = ["plugins/test-adapter/**"]
suites = ["protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["sdk/typescript/**"]
suites = ["sdk-typescript", "package-typescript"]

[[routes]]
patterns = ["sdk/python/**"]
suites = ["sdk-python"]

[[routes]]
patterns = ["sdk/go/**"]
suites = ["sdk-go"]

[[routes]]
patterns = ["schemas/**", "tests/fixtures/**", "scripts/validate_schemas.py"]
suites = ["protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["examples/**"]
suites = ["example"]

[[routes]]
patterns = ["compiler/**"]
suites = ["mlir"]

[[routes]]
patterns = ["tests/harness/suites.toml", "scripts/test_harness.py"]
suites = ["catalog"]

[[routes]]
patterns = ["tests/harness/**"]
suites = ["harness", "docs"]

[[routes]]
patterns = ["scripts/validate_docs.py"]
suites = ["harness", "docs"]

[[routes]]
patterns = ["tests/test-world/**"]
suites = ["test-world-deterministic", "test-world-live-process", "rust-durable", "rust-store-plugins", "rust-agent-plugin"]

[[routes]]
patterns = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml"]
suites = ["rust-workspace", "protocol", "sdk-rust", "sdk-typescript", "sdk-python", "sdk-go", "example"]

[[routes]]
patterns = ["sdk/typescript/package.json", "sdk/typescript/pnpm-lock.yaml"]
suites = ["sdk-typescript", "package-typescript"]

[[routes]]
patterns = [".gitignore"]
suites = ["docs"]

[[routes]]
patterns = ["scripts/verify-soak.sh"]
suites = ["rust-soak"]

[[routes]]
patterns = ["scripts/verify-analysis.sh"]
suites = ["rust-coverage", "rust-coverage-plugins", "rust-mutation", "rust-mutation-evolution-m4", "rust-mutation-plugins"]

[[routes]]
patterns = ["scripts/verify-sdk.sh"]
suites = ["sdk-rust", "sdk-typescript", "sdk-python", "sdk-go"]

[[routes]]
patterns = ["scripts/verify-protocol.sh"]
suites = ["protocol"]

[[routes]]
patterns = ["scripts/verify-example.sh"]
suites = ["example"]

[[routes]]
patterns = ["scripts/verify-typescript-package.sh"]
suites = ["package-typescript"]

[[routes]]
patterns = ["scripts/verify-rust-static.sh"]
suites = ["rust-workspace"]

[[routes]]
patterns = ["scripts/verify.sh", "scripts/verify-rust.sh", ".github/workflows/**"]
suites = ["full", "release-workflows"]

[[routes]]
patterns = [".gitlab-ci.yml", ".gitlab/**"]
suites = ["release-workflows"]
