[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cymule"
version = "0.1.0"
description = "Python authoring and engine client SDK for Cymule"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/cymule-framework/cymule"
Repository = "https://github.com/cymule-framework/cymule.git"
Issues = "https://github.com/cymule-framework/cymule/issues"

[dependency-groups]
dev = ["jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cymule"]
